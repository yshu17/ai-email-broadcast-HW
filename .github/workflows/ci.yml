name: CI

# Runs on every push to main and on every pull request. Nothing here uses a repository secret, so a pull
# request from a fork is checked the same way and cannot reach any.
on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    name: Lint, types, tests, build
    runs-on: ubuntu-latest
    timeout-minutes: 25
    # The integration tests run against a real Postgres (atomic queue claims, migrations and the
    # scheduler's races are the database's behaviour, and a mock would test the mock).
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: mailer
          POSTGRES_PASSWORD: mailer
          POSTGRES_DB: mailer
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U mailer -d mailer"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgres://mailer:mailer@localhost:5432/mailer
      NEXT_TELEMETRY_DISABLED: "1"
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies (from the lock file)
        run: npm ci --no-audit --no-fund
      - name: Lint
        run: npm run lint
      - name: Type check
        run: npm run typecheck
      - name: Tests
        run: npm test
      - name: Production build
        run: npm run build
      - name: Bundle the scripts the container runs
        run: npm run build:scripts
      - name: The developer test panel is not in the production build
        run: |
          set -eu
          test ! -d .next/server/app/api/dev
          if grep -rlF -e "Test Panel" -e "test.invalid" -e "setFixedTime" .next/server .next/static; then
            echo "developer test panel code or text found in the production build" >&2
            exit 1
          fi
      - name: Audit production dependencies
        # Fails on a high or critical advisory in what actually ships. Advisories in build and test tools
        # (dev dependencies) are listed by `npm audit` but do not reach a running server.
        run: npm audit --omit=dev --audit-level=high

  secrets:
    name: Secret scan
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
      # The gitleaks CLI over the whole history. (gitleaks-action scans "<first pushed commit>^..HEAD", which
      # fails on the first push of a new repository, whose first commit has no parent.)
      - name: Scan the repository history with gitleaks
        run: >-
          docker run --rm -v "$PWD:/repo" ghcr.io/gitleaks/gitleaks:v8.24.3
          git /repo --redact --no-banner --exit-code 1

  docker:
    name: Docker image
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3
      - name: Build the image (not pushed)
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: .
          load: true
          push: false
          tags: mailer:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: The image runs as a normal user and carries no secrets or test mail
        run: |
          set -eu
          test "$(docker run --rm --entrypoint id mailer:ci -u)" != "0"
          docker run --rm --entrypoint sh mailer:ci -c 'test ! -e .env && test ! -e received-emails && test ! -d node_modules/sharp && test -f server.js && test -f dist-scripts/migrate.cjs'
          docker image inspect mailer:ci --format '{{.Size}} bytes'
