name: Publish image

# Publishes the Docker image to GitHub Container Registry, and only after the CI workflow has passed on a
# push to main or on a version tag (v1.2.3). Pull requests never publish anything.
#
#   ghcr.io/<owner>/<repository>:latest   the newest main
#   ghcr.io/<owner>/<repository>:sha-<full commit id>   every published commit
#   ghcr.io/<owner>/<repository>:1.2.3    a version tag
#
# `workflow_run` executes the workflow file as it is on the default branch, with write access to packages,
# so it must never build the code of a pull request: it checks out the commit CI verified, and only when that
# CI run was a push (see the condition below).
on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main, "v*.*.*"]

permissions:
  contents: read

jobs:
  publish:
    name: Build and push
    if: >-
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3
      - uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@c299e40c65443455700f0fdfc63efafe5b349051 # v5
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=raw,value=latest,enable=${{ github.event.workflow_run.head_branch == 'main' }}
            type=raw,value=sha-${{ github.event.workflow_run.head_sha }}
            type=semver,pattern={{version}},value=${{ github.event.workflow_run.head_branch }},enable=${{ startsWith(github.event.workflow_run.head_branch, 'v') }}
      - uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
